<style>
:root{
  --forest:#141d16;--forest-2:#1c2a1f;
  --cream:#f3eee4;--muted:rgba(243,238,228,.7);--line:rgba(243,238,228,.2);
  --sage:#b3bfa8;--champ:#c9ad78;--champ-lt:#e3cf9f;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0}
html{background:var(--forest);-webkit-text-size-adjust:100%}
body{min-height:100svh;color:var(--cream);font:400 15px/1.5 Archivo,system-ui,sans-serif;display:flex;justify-content:center;overflow-x:hidden}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Fundo: luz quente no alto, sálvia embaixo, respirando devagar. Uma cena (cenas/links-*.webp) entra por cima quando existir. */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
  radial-gradient(60% 45% at 50% 8%,rgba(201,173,120,.30),rgba(201,173,120,0) 70%),
  radial-gradient(70% 50% at 10% 100%,rgba(179,191,168,.16),rgba(179,191,168,0) 70%),
  radial-gradient(50% 40% at 100% 60%,rgba(61,90,42,.35),rgba(61,90,42,0) 70%),
  linear-gradient(180deg,#18241a 0%,var(--forest) 60%)}
.bg::before{content:"";position:absolute;inset:-10%;background:radial-gradient(35% 28% at 50% 14%,rgba(227,207,159,.22),rgba(227,207,159,0) 70%);animation:breathe 9s ease-in-out infinite}
.bg_scene{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
.bg_scene img{width:100%;height:100%;object-fit:cover;object-position:50% 0;transform:scale(1.04);animation:push 28s ease-in-out infinite alternate}
.has-scene .bg_scene{opacity:1}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,29,22,0) 0%,rgba(20,29,22,.15) 30%,rgba(20,29,22,.55) 62%,rgba(20,29,22,.85) 100%)}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes push{to{transform:scale(1.1)}}
.dust{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}

.bio{width:100%;max-width:440px;min-height:100svh;display:flex;flex-direction:column;padding:max(44px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.bio_c{margin:auto 0}
.top{display:flex;flex-direction:column;align-items:center;text-align:center}
.photo{position:relative;width:clamp(128px,36vw,152px);aspect-ratio:1;border-radius:50%;padding:3px;background:linear-gradient(150deg,var(--champ-lt),#9c8150 50%,var(--sage));box-shadow:0 18px 44px rgba(0,0,0,.55),0 0 0 9px rgba(201,173,120,.1),0 0 70px rgba(201,173,120,.2)}
.photo img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#2a3a2d}
.logo{display:block;width:min(318px,84%);height:auto;margin-top:22px;filter:drop-shadow(0 2px 14px rgba(0,0,0,.5))}
.rule{width:min(260px,72%);height:1px;margin-top:16px;background:linear-gradient(90deg,rgba(201,173,120,0),var(--champ) 20%,var(--champ) 80%,rgba(201,173,120,0))}
.tag{margin-top:12px;padding-left:.24em;white-space:nowrap;font-size:clamp(9px,2.6vw,11px);font-weight:600;font-stretch:118%;letter-spacing:.24em;text-transform:uppercase;color:var(--champ-lt)}
.agenda{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:600;font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:rgba(20,29,22,.4)}
.agenda i{width:7px;height:7px;border-radius:50%;background:#7fd08a;box-shadow:0 0 0 0 rgba(127,208,138,.6);animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(127,208,138,.55)}70%,100%{box-shadow:0 0 0 9px rgba(127,208,138,0)}}

.links{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 20px 12px 18px;border:1px solid var(--line);border-radius:999px;color:var(--cream);text-decoration:none;background:rgba(20,29,22,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:border-color .25s,background-color .25s,transform .25s var(--ease)}
.btn:hover{border-color:var(--champ);background:rgba(42,52,33,.6);transform:translateY(-2px)}
.btn:active{transform:scale(.985)}
.btn:focus-visible{outline:2px solid var(--champ);outline-offset:4px}
.ico{width:24px;height:24px;flex:none;color:var(--champ)}
.btn_l{flex:1;min-width:0;font-size:12px;font-weight:700;font-stretch:118%;letter-spacing:.13em;text-transform:uppercase}
.btn_s{display:block;margin-top:2px;font-size:11px;font-weight:400;font-stretch:100%;letter-spacing:.02em;text-transform:none;opacity:.72}
.arrow{width:16px;height:16px;flex:none;color:var(--champ);transition:transform .25s var(--ease)}
.btn:hover .arrow{transform:translate(2px,-2px)}
.btn.is-main{min-height:70px;background:var(--sage);border-color:var(--sage);color:var(--forest);box-shadow:0 12px 34px rgba(179,191,168,.18)}
.btn.is-main:hover{background:#c9d2bf;border-color:#c9d2bf}
.btn.is-main .btn_l{font-size:13px}
.btn.is-main .ico,.btn.is-main .arrow{color:var(--forest)}
.btn.is-main .ico{width:26px;height:26px}
@media(max-width:359px){.btn_l{letter-spacing:.07em}}
.foot{padding-top:34px;text-align:center;font-size:11px;font-stretch:112%;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Como chegar: sobe de baixo no celular, cartão no centro no computador. */
.rota{padding:0;border:0;color:var(--cream);background:transparent;max-width:none;max-height:none;width:100%;margin:auto 0 0;overflow:visible}
.rota::backdrop{background:rgba(8,12,9,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.rota_c{position:relative;max-width:440px;margin:0 auto;padding:30px 20px max(22px,env(safe-area-inset-bottom));border:1px solid rgba(201,173,120,.35);border-bottom:0;border-radius:26px 26px 0 0;background:linear-gradient(180deg,#1f2c21,#121a14);box-shadow:0 -20px 60px rgba(0,0,0,.6);text-align:center}
.rota[open] .rota_c{animation:up .4s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:600px){.rota{margin:auto;width:auto}.rota_c{width:420px;border-bottom:1px solid rgba(201,173,120,.35);border-radius:26px}}
.rota_x{position:absolute;top:12px;right:12px}
.rota_x button{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--cream);cursor:pointer}
.rota_x svg{width:18px;height:18px}
.rota_t{font:600 12px/1 Archivo,sans-serif;font-stretch:125%;letter-spacing:.3em;text-transform:uppercase;color:var(--champ-lt)}
.rota_a{margin-top:14px;font-size:17px;line-height:1.45}
.rota_q{margin-top:22px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.rota_apps{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rota_app{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border:1px solid var(--line);border-radius:999px;color:var(--cream);text-decoration:none;font-size:12px;font-weight:700;font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.03);transition:border-color .2s,background-color .2s}
.rota_app:hover{border-color:var(--champ);background:rgba(201,173,120,.08)}
.rota_x button:focus-visible,.rota_app:focus-visible{outline:2px solid var(--champ);outline-offset:3px}

@media (prefers-reduced-motion:reduce){.bg::before,.bg_scene img,.agenda i{animation:none}}
@media (prefers-reduced-motion:no-preference){
  .top>*,.links>*{animation:enter .9s var(--ease) both}
  .top>:nth-child(2){animation-delay:.08s}.top>:nth-child(3){animation-delay:.14s}.top>:nth-child(4){animation-delay:.2s}.top>:nth-child(5){animation-delay:.26s}.top>:nth-child(6){animation-delay:.3s}
  .links>:nth-child(1){animation-delay:.36s}.links>:nth-child(2){animation-delay:.42s}.links>:nth-child(3){animation-delay:.48s}.links>:nth-child(4){animation-delay:.54s}
  @keyframes enter{from{opacity:0;transform:translateY(14px)}}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <!-- Cena opcional (Nano Banana): assets/img/cenas/links-celular.webp (em pé) e links-computador.webp (deitada). Com os arquivos na pasta, acrescentar data-ligada aqui. -->
  <div class="bg_scene" data-scene-portrait="assets/img/cenas/links-celular.webp" data-scene-landscape="assets/img/cenas/links-computador.webp"></div>
</div>
<canvas class="dust" aria-hidden="true"></canvas>

<main class="bio">
  <div class="bio_c">
    <header class="top">
      <figure class="photo"><img src="assets/img/laysa-rosto-480.webp" width="480" height="480" alt="Retrato da nutricionista Laysa Tavares"></figure>
      <h1 class="sr-only">Laysa Tavares, nutricionista</h1>
      <img class="logo" src="assets/img/logo-claro.png" width="1599" height="465" alt="Laysa Tavares Nutricionista">
      <div class="rule" aria-hidden="true"></div>
      <p class="tag">Emagrecimento · Comportamento</p>
      <p class="agenda"><i aria-hidden="true"></i>Agenda aberta</p>
    </header>

    <nav class="links" aria-label="Contato e site">
      <a class="btn is-main" href="https://wa.me/5573982141269?text=Ol%C3%A1%2C%20Laysa!%20Vim%20pelo%20Instagram%20e%20quero%20agendar%20uma%20consulta." target="_blank" rel="noopener noreferrer" data-contato>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.4-4.7A8.5 8.5 0 1 1 20.5 11.7Z"/><path d="M8.4 8.1c-.4.2-.9.9-.9 1.5 0 1.5 2.8 4.9 5.7 5.8.7.2 1.5-.1 2-.6l.6-.8-2.1-1-.8.8c-1.5-.6-2.5-1.6-3.1-3.1l.7-.7-1.1-2Z"/></svg>
        <span class="btn_l">Agendar consulta<span class="btn_s">Pelo WhatsApp</span></span>
        <svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5"/></svg>
      </a>
      <a class="btn" href="site/">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
        <span class="btn_l">Conhecer o site</span>
        <svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5"/></svg>
      </a>
      <a class="btn" href="site/#bioimpedancia">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v3M20.5 12h-3M12 20.5v-3M3.5 12h3"/><path d="m12 12 3.2-2.6"/></svg>
        <span class="btn_l">O que é bioimpedância</span>
        <svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5"/></svg>
      </a>
      <a class="btn" href="https://www.google.com/maps/search/?api=1&amp;query=R.%20Nilson%20Mendes%20Andrade%2C%20213%2C%20Ibirapu%C3%A3%20-%20BA" target="_blank" rel="noopener noreferrer" aria-haspopup="dialog" data-rota>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
        <span class="btn_l">Como chegar</span>
        <svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5"/></svg>
      </a>
    </nav>
  </div>
  <footer class="foot">Ibirapuã-BA e online<span data-crn hidden> · CRN-5 <!-- número --></span></footer>
</main>

<dialog class="rota" id="rota" aria-labelledby="rota-t">
  <div class="rota_c">
    <form class="rota_x" method="dialog"><button type="submit" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></form>
    <h2 class="rota_t" id="rota-t">Como chegar</h2>
    <p class="rota_a">R. Nilson Mendes Andrade, 213<br>Ibirapuã · BA</p>
    <p class="rota_q">Abrir rota com</p>
    <div class="rota_apps">
      <a class="rota_app" href="https://www.google.com/maps/dir/?api=1&amp;destination=R.%20Nilson%20Mendes%20Andrade%2C%20213%2C%20Ibirapu%C3%A3%20-%20BA" target="_blank" rel="noopener noreferrer">Google Maps</a>
      <a class="rota_app" href="https://waze.com/ul?q=R.%20Nilson%20Mendes%20Andrade%2C%20213%2C%20Ibirapu%C3%A3%20-%20BA&amp;navigate=yes" target="_blank" rel="noopener noreferrer">Waze</a>
    </div>
  </div>
</dialog>

<script>
/* Como chegar: escolha entre Google Maps e Waze. Sem suporte a <dialog>, o botão abre o Maps direto. */
(function () {
  var d = document.getElementById('rota'), b = document.querySelector('[data-rota]');
  if (!d || !b || typeof d.showModal !== 'function') return;
  b.addEventListener('click', function (e) { e.preventDefault(); d.showModal(); });
  d.addEventListener('click', function (e) { if (e.target === d) d.close(); });
  d.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function () { setTimeout(function () { d.close(); }, 300); }); });
})();

/* Cena de fundo: só entra se o arquivo existir (em pé no celular, deitada no computador). */
(function () {
  var box = document.querySelector('.bg_scene'); if (!box || !box.hasAttribute('data-ligada')) return;
  var src = matchMedia('(orientation: portrait)').matches ? box.dataset.scenePortrait : box.dataset.sceneLandscape;
  var img = new Image(); img.alt = ''; img.decoding = 'async';
  img.onload = function () { box.appendChild(img); document.documentElement.classList.add('has-scene'); };
  img.src = src;
})();

/* Sementes de luz subindo devagar. Desligadas para quem pede menos movimento. */
(function () {
  var c = document.querySelector('.dust');
  if (!c || !c.getContext || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var g = c.getContext('2d'), d = Math.min(devicePixelRatio || 1, 2), w = 0, h = 0, pts = [];
  function size() { w = c.width = Math.round(innerWidth * d); h = c.height = Math.round(innerHeight * d); }
  size(); addEventListener('resize', size);
  for (var i = 0; i < 42; i++) pts.push({ x: Math.random(), y: Math.random(), r: .5 + Math.random() * 1.5, s: .00018 + Math.random() * .0005, a: .2 + Math.random() * .5, p: Math.random() * 6.3 });
  function frame(t) {
    g.clearRect(0, 0, w, h);
    for (var i = 0; i < pts.length; i++) {
      var q = pts[i]; q.y -= q.s; if (q.y < -.02) { q.y = 1.02; q.x = Math.random(); }
      g.beginPath(); g.arc(q.x * w + Math.sin(t / 3400 + q.p) * 12 * d, q.y * h, q.r * d, 0, 6.3);
      g.fillStyle = 'rgba(227,207,159,' + (q.a * (.55 + .45 * Math.sin(t / 950 + q.p))).toFixed(3) + ')'; g.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* Rastreamento: se um dia entrar o Pixel da Meta, todo clique para o WhatsApp vira "Contact". */
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href*="wa.me"]');
  if (a && window.fbq) window.fbq('track', 'Contact');
}, true);
</script>
</body>
</html>
